name: tower_climb
description: Tower Climb — vertical platformer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/character.png
    - assets/images/mossy/
    - assets/images/ancient_civilization/
    - assets/images/eroded/
    - assets/images/desert/
    - assets/images/snowy/
    - assets/images/volcanic/
