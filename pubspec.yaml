name: tower_climb
description: Tower Climb — vertical platformer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_audio: ^2.1.5
  google_fonts: ^6.1.0
  shared_preferences: ^2.5.3
  rename_app: ^1.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    # Per-biome bgm. Flutter does not recurse into assets/audio/, and listing a
    # dir would bundle the raw source files too — so name each mp3.
    # New biome: drop <name>/<name>_bgm.mp3 and add one line here.
    - assets/audio/mossy/mossy_bgm.mp3
    - assets/audio/ancient_civilization/ancient_civilization_bgm.mp3
    - assets/audio/eroded/eroded_bgm.mp3
    - assets/audio/desert/desert_bgm.mp3
    - assets/audio/snowy/snowy_bgm.mp3
    - assets/audio/volcanic/volcanic_bgm.mp3
    - assets/images/character.png
    - assets/images/character_chubby_64.png
    - assets/images/mossy/
    - assets/images/ancient_civilization/
    - assets/images/eroded/
    - assets/images/desert/
    - assets/images/snowy/
    - assets/images/volcanic/
